name: CI

# Every commit on main builds, tests, and respects the architecture boundaries.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test & enforce boundaries
    runs-on: macos-26 # ships Xcode 26 / Swift 6.2 by default
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Fail fast on architecture violations before spending build time.
      - name: Enforce architecture boundaries
        run: ./Scripts/check-boundaries.sh

      - name: Build (Swift 6, strict concurrency)
        run: swift build

      - name: Test (Swift Testing)
        run: swift test

      # The package is only half the product: the shipped artefact is the sandboxed .app. Building it
      # here catches a broken Xcode project, entitlements file, or app/package wiring that `swift
      # build` cannot see. Uses the shared scheme (a bare `-target` cannot resolve the package
      # product); no signing identity is needed just to compile.
      - name: Build macOS app target
        run: |
          xcodebuild -project App/AudioInspector.xcodeproj \
                     -scheme AudioInspector \
                     -configuration Debug \
                     CODE_SIGNING_ALLOWED=NO \
                     build
